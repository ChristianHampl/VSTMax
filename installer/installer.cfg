# Windows-Installer. Bauen auf Windows, nachdem installer/stage.ps1 das Plug-in nach payload/ gelegt hat:
#   $env:PYTHONPATH = (Get-Location).Path   # aus dem Projektordner, vor dem Wechsel nach installer/
#   pynsist installer/installer.cfg
# pynsist wechselt in diesen Ordner. Pfade unten sind relativ zu installer/.

[Application]
name=AI Mix Engineer
version=0.1.0
publisher=AI Mix Engineer
entry_point=app.main:main
console=false
extra_preamble=qt_preamble.py

[Python]
version=3.12.10
bitness=64

[Include]
packages=app
    engine
    integration
pypi_wheels=numpy==2.5.4
    scipy==1.18.1
    soundfile==0.14.0
    cffi==2.1.1
    PySide6==6.12.0
    PySide6_Essentials==6.12.0
    PySide6_Addons==6.12.0
    shiboken6==6.12.0
    mido==1.3.3
    python-rtmidi==1.5.8
files=payload/AIME.vst3 > $INSTDIR
    payload/AIME_Bridge.js > $INSTDIR
    ../profiles > $INSTDIR

[Build]
directory=build
installer_name=AI-Mix-Engineer-Setup.exe
